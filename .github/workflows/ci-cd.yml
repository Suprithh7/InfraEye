name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Node workspaces
        run: npm install
      - name: Build Node services and dashboard
        run: npm run build
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt
      - name: Run local ML training
        run: python ml/pipelines/run_local_training.py
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker
        run: gcloud auth configure-docker --quiet
      - name: Build and push API Gateway image
        run: |
          docker build -f infra/docker/api-gateway.Dockerfile -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/api-gateway:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/api-gateway:${{ github.sha }}
      - name: Build and push inspection service image
        run: |
          docker build -f infra/docker/inspection-service.Dockerfile -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/inspection-service:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/inspection-service:${{ github.sha }}
      - name: Build and push risk scoring service image
        run: |
          docker build -f infra/docker/risk-scoring-service.Dockerfile -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/risk-scoring-service:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/risk-scoring-service:${{ github.sha }}
      - name: Build and push satellite service image
        run: |
          docker build -f infra/docker/satellite-service.Dockerfile -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/satellite-service:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/satellite-service:${{ github.sha }}
      - name: Build and push notification service image
        run: |
          docker build -f infra/docker/notification-service.Dockerfile -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/notification-service:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/notification-service:${{ github.sha }}
      - name: Build and push data processing service image
        run: |
          docker build -f infra/docker/data-processing-service.Dockerfile -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/data-processing-service:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/data-processing-service:${{ github.sha }}
      - name: Build and push dashboard image
        run: |
          docker build -f infra/docker/dashboard.Dockerfile -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/dashboard:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/dashboard:${{ github.sha }}
      - name: Deploy to GKE
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME }}
          REGION: ${{ secrets.GKE_REGION }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash infra/scripts/deploy-gke.sh
