name: slumsafe_mobile
description: Offline-first municipal inspection client for SlumSafe CV.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  camera: ^0.11.0+2
  tflite_flutter: ^0.11.0
  image: ^4.3.0
  intl: ^0.20.2

flutter:
  uses-material-design: true
  assets:
    - assets/models/
