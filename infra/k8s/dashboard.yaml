apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: slumsafe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: gcr.io/slumsafe-prod/dashboard:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: slumsafe
spec:
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 80
