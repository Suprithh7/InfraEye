apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-scoring-service
  namespace: slumsafe
spec:
  replicas: 3
  selector:
    matchLabels:
      app: risk-scoring-service
  template:
    metadata:
      labels:
        app: risk-scoring-service
    spec:
      containers:
        - name: risk-scoring-service
          image: gcr.io/slumsafe-prod/risk-scoring-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: slumsafe-config
---
